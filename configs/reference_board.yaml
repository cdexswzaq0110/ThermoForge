# 設計副駕的參考板。
#
# 這些數字**刻意落在訓練分佈內**（ID_RANGES），因為副駕存在的目的之一就是
# 示範「什麼時候可以相信代理模型、什麼時候不行」——起點在分佈內，
# 使用者一問「CPU 拉到 60 W 呢」就會把它推出去，那正是要示範的那一刻。
#
# 誠實邊界：這是一塊**均勻散熱**的板級模型（單一 h、單一 kt），不是有散熱片的
# 伺服器主機板。真實伺服器的散熱片會讓局部 h 高一個量級，而這個物理模型表達不了。
# 所以功率數字看起來像 SBC／邊緣運算板，而不是機架式伺服器——那是模型的限制，
# 不是把數字調小來讓結果好看。

name: edge-sbc-v1
lx: 0.22          # m
ly: 0.18
kt: 0.20          # W/K，片導熱（導熱係數 x 板厚）
h_conv: 70.0      # W/m^2K，上下表面對流係數總和
t_amb: 35.0       # degC

# 設計約束：熱點溫度上限
t_max_allowed: 95.0

components:
  - {name: CPU,    aliases: [cpu, 處理器, soc],        cx: 0.070, cy: 0.115, w: 0.028, h: 0.028, power: 25.5}
  - {name: GPU,    aliases: [gpu, 顯示, 加速器, npu],   cx: 0.150, cy: 0.115, w: 0.026, h: 0.026, power: 21.9}
  - {name: VRM,    aliases: [vrm, 電源, 穩壓],          cx: 0.070, cy: 0.040, w: 0.020, h: 0.010, power: 8.8}
  - {name: NIC,    aliases: [nic, 網卡, 網路],          cx: 0.185, cy: 0.045, w: 0.014, h: 0.014, power: 5.8}
  - {name: DIMM_A, aliases: [dimm_a, 記憶體a, 記憶體],   cx: 0.110, cy: 0.150, w: 0.010, h: 0.026, power: 5.5}
  - {name: DIMM_B, aliases: [dimm_b, 記憶體b],          cx: 0.128, cy: 0.150, w: 0.010, h: 0.026, power: 5.5}
